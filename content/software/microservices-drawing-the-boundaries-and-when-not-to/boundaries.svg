<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-labelledby="t">
  <title id="t">Split by entity: Customer, Payment, Account and Transaction services, with the refund feature touching all four. Split by capability, including Onboarding, Payments, Risk, Ledger and Notifications, with the refund touching only Payments, which publishes PaymentRefunded to Ledger</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .bad { fill: #fca5a5; font-size: 12px; }
    .band { fill: #0d1829; stroke: #3a4d6b; stroke-width: 1.5; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .badbox { fill: #2a1620; stroke: #f87171; stroke-width: 1.5; }
    .badptr { fill: none; stroke: #f87171; stroke-width: 2; stroke-dasharray: 6 4; }
    .dir { fill: none; stroke: #9baeca; stroke-width: 1.5; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9baeca"/>
    </marker>
  </defs>
  <rect width="800" height="320" fill="#08111f"/>

  <rect class="band" x="20" y="20" width="370" height="280" rx="8"/>
  <text x="205" y="46" text-anchor="middle">Split by entity</text>
  <rect class="badbox" x="40" y="80" width="150" height="50" rx="6"/>
  <text x="115" y="110" text-anchor="middle">Customer</text>
  <rect class="badbox" x="220" y="80" width="150" height="50" rx="6"/>
  <text x="295" y="110" text-anchor="middle">Payment</text>
  <rect class="badbox" x="40" y="170" width="150" height="50" rx="6"/>
  <text x="115" y="200" text-anchor="middle">Account</text>
  <rect class="badbox" x="220" y="170" width="150" height="50" rx="6"/>
  <text x="295" y="200" text-anchor="middle">Transaction</text>
  <path class="badptr" d="M115 130 V150 H295 V130 M295 150 V170 M115 150 V170"/>
  <text class="bad" x="205" y="252" text-anchor="middle">refund feature: 4 services</text>
  <text class="muted" x="205" y="272" text-anchor="middle">changed and deployed together</text>

  <rect class="band" x="410" y="20" width="370" height="280" rx="8"/>
  <text x="595" y="46" text-anchor="middle">Split by capability</text>
  <rect class="box" x="430" y="70" width="150" height="40" rx="6"/>
  <text x="505" y="95" text-anchor="middle">Onboarding</text>
  <rect class="hl" x="610" y="70" width="150" height="40" rx="6"/>
  <text x="685" y="95" text-anchor="middle">Payments</text>
  <rect class="box" x="430" y="130" width="150" height="40" rx="6"/>
  <text x="505" y="155" text-anchor="middle">Risk</text>
  <rect class="box" x="610" y="190" width="150" height="40" rx="6"/>
  <text x="685" y="215" text-anchor="middle">Ledger</text>
  <rect class="box" x="430" y="190" width="150" height="40" rx="6"/>
  <text x="505" y="215" text-anchor="middle">Notifications</text>
  <path class="dir" d="M685 110 V186" marker-end="url(#m)"/>
  <text class="muted" x="693" y="146">Payment</text>
  <text class="muted" x="693" y="162">Refunded</text>
  <text class="muted" x="595" y="262" text-anchor="middle">refund: one service, plus an</text>
  <text class="muted" x="595" y="280" text-anchor="middle">event Ledger already consumes</text>
</svg>
