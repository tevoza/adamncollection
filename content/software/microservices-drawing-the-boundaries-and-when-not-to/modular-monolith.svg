<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="t">
  <title id="t">A modular monolith: one Host deployable containing Payments, Risk and Ledger modules, each with its own schema, talking through public interfaces and in-process events. Risk is later extracted into its own service with its own database, its interface replaced by an HTTP client and its events carried by a broker</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .band { fill: none; stroke: #3a4d6b; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .ext { fill: #13233b; stroke: #c084fc; stroke-width: 2; }
    .ptr { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
    .dir { fill: none; stroke: #9baeca; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .extptr { fill: none; stroke: #c084fc; stroke-width: 1.75; stroke-dasharray: 6 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9baeca"/>
    </marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#08111f"/>

  <rect class="band" x="20" y="50" width="480" height="230" rx="10"/>
  <text x="36" y="76">Host</text>
  <text class="muted" x="80" y="76">one deployable</text>

  <rect class="box" x="40" y="96" width="130" height="100" rx="6"/>
  <text x="105" y="122" text-anchor="middle">Payments</text>
  <text class="muted" x="105" y="146" text-anchor="middle">module</text>
  <text class="muted" x="105" y="178" text-anchor="middle">own schema</text>
  <rect class="hl" x="200" y="96" width="130" height="100" rx="6"/>
  <text x="265" y="122" text-anchor="middle">Risk</text>
  <text class="muted" x="265" y="146" text-anchor="middle">module</text>
  <text class="muted" x="265" y="178" text-anchor="middle">own schema</text>
  <rect class="box" x="360" y="96" width="130" height="100" rx="6"/>
  <text x="425" y="122" text-anchor="middle">Ledger</text>
  <text class="muted" x="425" y="146" text-anchor="middle">module</text>
  <text class="muted" x="425" y="178" text-anchor="middle">own schema</text>

  <path class="ptr" d="M170 132 H196" marker-end="url(#a)"/>
  <path class="dir" d="M105 196 C105 236, 425 236, 425 200" marker-end="url(#m)"/>
  <text class="muted" x="262" y="256" text-anchor="middle">public interfaces + in-process events</text>

  <path class="extptr" d="M265 96 C265 30, 640 20, 640 92" marker-end="url(#p)"/>
  <text class="muted" x="450" y="24" text-anchor="middle">extract when a team or workload needs it</text>

  <rect class="ext" x="540" y="96" width="220" height="100" rx="6"/>
  <text x="650" y="124" text-anchor="middle">Risk service</text>
  <text class="muted" x="650" y="148" text-anchor="middle">own database</text>
  <text class="muted" x="650" y="166" text-anchor="middle">interface → HTTP client</text>
  <text class="muted" x="650" y="184" text-anchor="middle">events → message broker</text>

  <text class="muted" x="400" y="312" text-anchor="middle">Draw the boundaries first. Make them network boundaries later, one at a time.</text>
</svg>
