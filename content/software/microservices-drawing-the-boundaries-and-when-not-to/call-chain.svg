<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t">
  <title id="t">Before: Payments calls Onboarding, Risk, the card provider, Ledger and Notifications synchronously, for about 99.5 percent combined availability. After: Payments calls only Risk and the provider synchronously, reads a local copy of merchant data, and publishes PaymentCaptured, which Ledger and Notifications consume asynchronously</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .sm { font-size: 12px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .bad { fill: #fca5a5; font-size: 12px; }
    .band { fill: #0d1829; stroke: #3a4d6b; stroke-width: 1.5; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .ptr { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
    .dir { fill: none; stroke: #9baeca; stroke-width: 1.5; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9baeca"/>
    </marker>
  </defs>
  <rect width="800" height="420" fill="#08111f"/>

  <rect class="band" x="20" y="20" width="370" height="380" rx="8"/>
  <text x="205" y="46" text-anchor="middle">Before: five synchronous hops</text>
  <rect class="box" x="36" y="180" width="70" height="40" rx="6"/>
  <text class="sm" x="71" y="205" text-anchor="middle">Client</text>
  <rect class="hl" x="130" y="180" width="100" height="40" rx="6"/>
  <text class="sm" x="180" y="205" text-anchor="middle">Payments</text>
  <path class="ptr" d="M106 200 H126" marker-end="url(#a)"/>

  <rect class="box" x="270" y="66" width="104" height="36" rx="6"/>
  <text class="sm" x="322" y="89" text-anchor="middle">Onboarding</text>
  <rect class="box" x="270" y="124" width="104" height="36" rx="6"/>
  <text class="sm" x="322" y="147" text-anchor="middle">Risk</text>
  <rect class="box" x="270" y="182" width="104" height="36" rx="6"/>
  <text class="sm" x="322" y="205" text-anchor="middle">Provider</text>
  <rect class="box" x="270" y="240" width="104" height="36" rx="6"/>
  <text class="sm" x="322" y="263" text-anchor="middle">Ledger</text>
  <rect class="box" x="270" y="298" width="104" height="36" rx="6"/>
  <text class="sm" x="322" y="321" text-anchor="middle">Notifications</text>
  <path class="ptr" d="M230 196 L266 86" marker-end="url(#a)"/>
  <path class="ptr" d="M230 198 L266 143" marker-end="url(#a)"/>
  <path class="ptr" d="M230 200 H266" marker-end="url(#a)"/>
  <path class="ptr" d="M230 202 L266 257" marker-end="url(#a)"/>
  <path class="ptr" d="M230 204 L266 314" marker-end="url(#a)"/>
  <text class="bad" x="205" y="364" text-anchor="middle">0.999^5 ≈ 99.5% available</text>
  <text class="muted" x="205" y="384" text-anchor="middle">a receipt outage fails payments</text>

  <rect class="band" x="410" y="20" width="370" height="380" rx="8"/>
  <text x="595" y="46" text-anchor="middle">After: sync only what's needed</text>
  <rect class="box" x="424" y="150" width="62" height="40" rx="6"/>
  <text class="sm" x="455" y="175" text-anchor="middle">Client</text>
  <rect class="hl" x="510" y="150" width="100" height="40" rx="6"/>
  <text class="sm" x="560" y="175" text-anchor="middle">Payments</text>
  <path class="ptr" d="M486 170 H506" marker-end="url(#a)"/>

  <rect class="box" x="660" y="90" width="104" height="36" rx="6"/>
  <text class="sm" x="712" y="113" text-anchor="middle">Risk</text>
  <rect class="box" x="660" y="152" width="104" height="36" rx="6"/>
  <text class="sm" x="712" y="175" text-anchor="middle">Provider</text>
  <path class="ptr" d="M610 166 L656 110" marker-end="url(#a)"/>
  <path class="ptr" d="M610 170 H656" marker-end="url(#a)"/>

  <rect class="box" x="424" y="232" width="100" height="44" rx="6"/>
  <text class="sm" x="474" y="251" text-anchor="middle">merchant</text>
  <text class="sm" x="474" y="267" text-anchor="middle">local copy</text>
  <path class="dir" d="M540 190 L500 228" marker-end="url(#m)"/>

  <rect class="box" x="512" y="282" width="124" height="36" rx="6"/>
  <text class="sm" x="574" y="305" text-anchor="middle">PaymentCaptured</text>
  <path class="dir" d="M568 190 L574 278" marker-end="url(#m)"/>
  <text class="muted" x="580" y="236">outbox</text>

  <rect class="box" x="664" y="250" width="110" height="36" rx="6"/>
  <text class="sm" x="719" y="273" text-anchor="middle">Ledger</text>
  <rect class="box" x="664" y="310" width="110" height="36" rx="6"/>
  <text class="sm" x="719" y="333" text-anchor="middle">Notifications</text>
  <path class="dir" d="M636 294 L660 270" marker-end="url(#m)"/>
  <path class="dir" d="M636 306 L660 326" marker-end="url(#m)"/>

  <text class="muted" x="595" y="364" text-anchor="middle">2 sync dependencies; outages delay</text>
  <text class="muted" x="595" y="384" text-anchor="middle">postings and receipts, not payments</text>
</svg>
