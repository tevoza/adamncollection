<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t">
  <title id="t">Before: PaymentExpiryJob in Application depends directly on SqlPaymentRepository in Infrastructure. After: PaymentExpiryJob depends on IPaymentRepository, which also lives in Application, and SqlPaymentRepository in Infrastructure implements it, so the arrow crossing the layer boundary points upward</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .sm { font-size: 12px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .bad { fill: #fca5a5; font-size: 12px; }
    .band { fill: #0d1829; stroke: #3a4d6b; stroke-width: 1.5; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .ptr { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
    .badptr { fill: none; stroke: #f87171; stroke-width: 1.75; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#08111f"/>

  <text x="200" y="30" text-anchor="middle">Before</text>
  <text x="600" y="30" text-anchor="middle">After</text>

  <rect class="band" x="20" y="44" width="360" height="114" rx="6"/>
  <rect class="band" x="20" y="166" width="360" height="124" rx="6"/>
  <text class="muted" x="32" y="62">Application</text>
  <text class="muted" x="32" y="184">Infrastructure</text>
  <rect class="box" x="110" y="84" width="180" height="44" rx="6"/>
  <text class="sm" x="200" y="111" text-anchor="middle">PaymentExpiryJob</text>
  <rect class="box" x="100" y="216" width="200" height="44" rx="6"/>
  <text class="sm" x="200" y="243" text-anchor="middle">SqlPaymentRepository</text>
  <path class="badptr" d="M200 128 V212" marker-end="url(#r)"/>
  <text class="bad" x="212" y="176">depends on</text>

  <rect class="band" x="420" y="44" width="360" height="114" rx="6"/>
  <rect class="band" x="420" y="166" width="360" height="124" rx="6"/>
  <text class="muted" x="432" y="62">Application</text>
  <text class="muted" x="432" y="184">Infrastructure</text>
  <rect class="box" x="432" y="84" width="140" height="44" rx="6"/>
  <text class="sm" x="502" y="104" text-anchor="middle">PaymentExpiry</text>
  <text class="sm" x="502" y="120" text-anchor="middle">Job</text>
  <rect class="hl" x="600" y="84" width="168" height="44" rx="6"/>
  <text class="sm" x="684" y="111" text-anchor="middle">IPaymentRepository</text>
  <path class="ptr" d="M572 106 H596" marker-end="url(#a)"/>
  <rect class="box" x="584" y="216" width="184" height="44" rx="6"/>
  <text class="sm" x="676" y="243" text-anchor="middle">SqlPaymentRepository</text>
  <path class="ptr" d="M684 216 V132" marker-end="url(#a)"/>
  <text class="muted" x="672" y="178" text-anchor="end">implements</text>

  <text class="muted" x="400" y="322" text-anchor="middle">The arrow crossing the boundary reverses: Infrastructure now depends on Application.</text>
</svg>
