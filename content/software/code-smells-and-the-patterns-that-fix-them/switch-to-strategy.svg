<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="t">
  <title id="t">Before: the same switch on payment method appears in six places across three classes. After: one registration block, a lookup, and one class per payment method</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .sm { font-size: 12px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .bad { fill: #fca5a5; font-size: 12px; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .badbox { fill: #2a1620; stroke: #f87171; stroke-width: 1.5; }
    .ptr { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="760" height="450" fill="#08111f"/>

  <text x="190" y="32" text-anchor="middle">Before: six switches</text>
  <text x="570" y="32" text-anchor="middle">After: one place</text>

  <rect class="box" x="30" y="50" width="320" height="180" rx="6"/>
  <text x="46" y="74">PaymentService</text>
  <rect class="badbox" x="46" y="88" width="288" height="28" rx="4"/>
  <text class="sm" x="58" y="107">ChargeAsync</text>
  <text class="bad" x="322" y="107" text-anchor="end">switch (Method)</text>
  <rect class="badbox" x="46" y="122" width="288" height="28" rx="4"/>
  <text class="sm" x="58" y="141">CalculateFee</text>
  <text class="bad" x="322" y="141" text-anchor="end">switch (Method)</text>
  <rect class="badbox" x="46" y="156" width="288" height="28" rx="4"/>
  <text class="sm" x="58" y="175">SettlementDelay</text>
  <text class="bad" x="322" y="175" text-anchor="end">switch (Method)</text>
  <rect class="badbox" x="46" y="190" width="288" height="28" rx="4"/>
  <text class="sm" x="58" y="209">RefundAsync</text>
  <text class="bad" x="322" y="209" text-anchor="end">switch (Method)</text>

  <rect class="box" x="30" y="250" width="320" height="64" rx="6"/>
  <text x="46" y="272">WebhookHandler</text>
  <rect class="badbox" x="46" y="280" width="288" height="24" rx="4"/>
  <text class="bad" x="322" y="297" text-anchor="end">switch (Method)</text>

  <rect class="box" x="30" y="330" width="320" height="64" rx="6"/>
  <text x="46" y="352">ReconciliationJob</text>
  <rect class="badbox" x="46" y="360" width="288" height="24" rx="4"/>
  <text class="bad" x="322" y="377" text-anchor="end">switch (Method)</text>

  <rect class="hl" x="410" y="50" width="320" height="110" rx="6"/>
  <text x="426" y="74">Program.cs</text>
  <text class="muted" x="714" y="74" text-anchor="end">composition root</text>
  <text class="sm" x="426" y="100">AddSingleton&lt;…, CardProvider&gt;</text>
