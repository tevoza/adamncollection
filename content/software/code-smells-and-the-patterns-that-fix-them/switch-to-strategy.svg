  <path class="ptr" d="M570 160 V188" marker-end="url(#a)"/>

  <rect class="box" x="440" y="192" width="260" height="40" rx="6"/>
  <text x="570" y="217" text-anchor="middle">PaymentProviders.For()</text>
  <path class="ptr" d="M520 232 L462 274" marker-end="url(#a)"/>
  <path class="ptr" d="M570 232 V274" marker-end="url(#a)"/>
  <path class="ptr" d="M620 232 L678 274" marker-end="url(#a)"/>

  <rect class="box" x="410" y="278" width="100" height="116" rx="6"/>
  <text class="sm" x="460" y="300" text-anchor="middle">Card</text>
