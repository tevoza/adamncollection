  <text class="muted" x="460" y="342" text-anchor="middle">charge</text>
  <text class="muted" x="460" y="360" text-anchor="middle">fee</text>
  <text class="muted" x="460" y="378" text-anchor="middle">settlement</text>
  <text class="muted" x="570" y="342" text-anchor="middle">charge</text>
  <text class="muted" x="570" y="360" text-anchor="middle">fee</text>
  <text class="muted" x="570" y="378" text-anchor="middle">settlement</text>
  <text class="muted" x="680" y="342" text-anchor="middle">charge</text>
  <text class="muted" x="680" y="360" text-anchor="middle">fee</text>
  <text class="muted" x="680" y="378" text-anchor="middle">settlement</text>

  <text class="muted" x="380" y="420" text-anchor="middle">A fourth payment method: before, find every switch.</text>
  <text class="muted" x="380" y="438" text-anchor="middle">After, one new class and one registration line.</text>
