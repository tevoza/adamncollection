<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="t">
  <title id="t">What each file can hold. A .key holds a private key. A .csr holds a public key and the requested name, signed by the private key. A .crt or .cer holds one certificate, with its public key, in PEM or DER. A chain file such as fullchain.pem holds several certificates, leaf first. A .pfx or .p12 is a password-protected container holding a private key, its certificate and usually the chain. A .p7b holds certificates with no private key</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 13.5px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .bad { fill: #fca5a5; font-size: 12px; }
    .rule { stroke: #3a4d6b; stroke-width: 1; }
    .yes { fill: #7dd3fc; }
    .secret { fill: #f87171; }
    .no { stroke: #3a4d6b; stroke-width: 2; }
  </style>
  <rect width="800" height="380" fill="#08111f"/>

  <!-- column headers -->
  <text class="bad" x="340" y="34" text-anchor="middle">private key</text>
  <text class="muted" x="460" y="34" text-anchor="middle">public key</text>
  <text class="muted" x="580" y="34" text-anchor="middle">certificate</text>
  <text class="muted" x="700" y="34" text-anchor="middle">CA certs</text>
  <line class="rule" x1="20" y1="48" x2="780" y2="48"/>

  <!-- .key -->
  <text x="20" y="74">.key</text>
  <text class="muted" x="20" y="92">PKCS#8 (or older RSA/EC) PEM</text>
  <circle class="secret" cx="340" cy="78" r="7"/>
  <line class="no" x1="452" y1="78" x2="468" y2="78"/>
  <line class="no" x1="572" y1="78" x2="588" y2="78"/>
  <line class="no" x1="692" y1="78" x2="708" y2="78"/>
  <line class="rule" x1="20" y1="104" x2="780" y2="104"/>

  <!-- .csr -->
  <text x="20" y="130">.csr</text>
  <text class="muted" x="20" y="148">PKCS#10: public key + name</text>
  <line class="no" x1="332" y1="134" x2="348" y2="134"/>
  <circle class="yes" cx="460" cy="134" r="7"/>
  <line class="no" x1="572" y1="134" x2="588" y2="134"/>
  <line class="no" x1="692" y1="134" x2="708" y2="134"/>
  <line class="rule" x1="20" y1="160" x2="780" y2="160"/>

  <!-- .crt / .cer -->
  <text x="20" y="186">.crt / .cer</text>
  <text class="muted" x="20" y="204">one certificate, PEM or DER</text>
  <line class="no" x1="332" y1="190" x2="348" y2="190"/>
  <circle class="yes" cx="460" cy="190" r="7"/>
  <circle class="yes" cx="580" cy="190" r="7"/>
  <line class="no" x1="692" y1="190" x2="708" y2="190"/>
  <line class="rule" x1="20" y1="216" x2="780" y2="216"/>

  <!-- chain .pem -->
  <text x="20" y="242">fullchain.pem</text>
  <text class="muted" x="20" y="260">PEM blocks, leaf first</text>
  <line class="no" x1="332" y1="246" x2="348" y2="246"/>
  <circle class="yes" cx="460" cy="246" r="7"/>
  <circle class="yes" cx="580" cy="246" r="7"/>
  <circle class="yes" cx="700" cy="246" r="7"/>
  <line class="rule" x1="20" y1="272" x2="780" y2="272"/>

  <!-- .pfx / .p12 -->
  <text x="20" y="298">.pfx / .p12</text>
  <text class="muted" x="20" y="316">PKCS#12, password-protected</text>
  <circle class="secret" cx="340" cy="302" r="7"/>
  <circle class="yes" cx="460" cy="302" r="7"/>
  <circle class="yes" cx="580" cy="302" r="7"/>
  <circle cx="700" cy="302" r="6" fill="none" stroke="#7dd3fc" stroke-width="2"/>
  <text class="muted" x="716" y="306">usually</text>
  <line class="rule" x1="20" y1="328" x2="780" y2="328"/>

  <!-- .p7b -->
  <text x="20" y="354">.p7b</text>
  <text class="muted" x="20" y="372">PKCS#7: certificates, no key</text>
  <line class="no" x1="332" y1="358" x2="348" y2="358"/>
  <circle class="yes" cx="460" cy="358" r="7"/>
  <circle class="yes" cx="580" cy="358" r="7"/>
  <circle class="yes" cx="700" cy="358" r="7"/>
</svg>
