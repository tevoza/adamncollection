<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t">
  <title id="t">Reference direction in an event subscription. The code reads as Subscriber depending on Publisher. In memory, the long-lived Publisher's DataChanged invocation list holds a delegate whose target is each Subscriber, so every subscriber created per request stays reachable as long as the publisher does</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .badbox { fill: #2a1620; stroke: #f87171; stroke-width: 1.5; }
    .ptr { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
    .dir { fill: none; stroke: #9baeca; stroke-width: 1.5; }
    .badptr { fill: none; stroke: #f87171; stroke-width: 1.75; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9baeca"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#08111f"/>

  <text class="muted" x="40" y="26">as the code reads</text>
  <rect class="box" x="40" y="38" width="200" height="44" rx="6"/>
  <text x="140" y="65" text-anchor="middle">Subscriber</text>
  <path class="dir" d="M240 60 H436" marker-end="url(#m)"/>
  <text class="muted" x="338" y="52" text-anchor="middle">+= DataChanged</text>
  <rect class="box" x="440" y="38" width="200" height="44" rx="6"/>
  <text x="540" y="65" text-anchor="middle">Publisher</text>

  <text class="muted" x="40" y="126">what memory holds</text>
  <rect class="hl" x="40" y="160" width="200" height="60" rx="6"/>
  <text x="140" y="186" text-anchor="middle">Publisher</text>
  <text class="muted" x="140" y="206" text-anchor="middle">singleton</text>
  <path class="ptr" d="M240 190 H296" marker-end="url(#a)"/>
  <rect class="box" x="300" y="160" width="200" height="60" rx="6"/>
  <text x="400" y="186" text-anchor="middle">DataChanged</text>
  <text class="muted" x="400" y="206" text-anchor="middle">invocation list</text>

  <path class="badptr" d="M500 182 L576 160" marker-end="url(#r)"/>
  <path class="badptr" d="M500 190 H576" marker-end="url(#r)"/>
  <path class="badptr" d="M500 198 L576 232" marker-end="url(#r)"/>
  <rect class="badbox" x="580" y="136" width="180" height="36" rx="6"/>
  <text x="670" y="159" text-anchor="middle">Subscriber 1</text>
  <rect class="badbox" x="580" y="176" width="180" height="36" rx="6"/>
  <text x="670" y="199" text-anchor="middle">Subscriber 2</text>
  <rect class="badbox" x="580" y="216" width="180" height="36" rx="6"/>
  <text x="670" y="239" text-anchor="middle">Subscriber 3 …</text>

  <text class="muted" x="400" y="284" text-anchor="middle">each delegate's target keeps a subscriber reachable while the publisher lives</text>
</svg>
