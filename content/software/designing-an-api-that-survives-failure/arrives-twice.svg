<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="t">
  <title id="t">Two failed requests that look the same to the client. In the first, the request is lost on the way and the server never sees it. In the second, the server processes the payment but the response is lost on the way back. In both cases the client sees only a timeout, so it retries, and in the second case the retry is a duplicate</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .bad { fill: #fca5a5; font-size: 12px; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .ptr { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
    .x { stroke: #f87171; stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="800" height="300" fill="#08111f"/>

  <!-- Request lost -->
  <text class="muted" x="400" y="34" text-anchor="middle">request lost</text>
  <rect class="box" x="40" y="54" width="140" height="48" rx="6"/>
  <text x="110" y="83" text-anchor="middle">client</text>
  <rect class="box" x="620" y="54" width="140" height="48" rx="6"/>
  <text x="690" y="83" text-anchor="middle">server</text>
  <path class="ptr" d="M180 78 H390"/>
  <text class="muted" x="286" y="70" text-anchor="middle">POST /payments</text>
  <line class="x" x1="392" y1="70" x2="408" y2="86"/>
  <line class="x" x1="392" y1="86" x2="408" y2="70"/>
  <text class="bad" x="110" y="120" text-anchor="middle">timeout</text>
  <text class="muted" x="690" y="120" text-anchor="middle">never sees it</text>

  <!-- Response lost -->
  <text class="muted" x="400" y="156" text-anchor="middle">response lost</text>
  <rect class="box" x="40" y="174" width="140" height="48" rx="6"/>
  <text x="110" y="203" text-anchor="middle">client</text>
  <rect class="hl" x="620" y="174" width="140" height="48" rx="6"/>
  <text x="690" y="203" text-anchor="middle">server</text>
  <path class="ptr" d="M180 188 H616" marker-end="url(#a)"/>
  <text class="muted" x="400" y="182" text-anchor="middle">POST /payments</text>
  <path class="ptr" d="M620 210 H410"/>
  <text class="muted" x="515" y="226" text-anchor="middle">201 Created</text>
  <line class="x" x1="392" y1="202" x2="408" y2="218"/>
  <line class="x" x1="392" y1="218" x2="408" y2="202"/>
  <text class="bad" x="110" y="240" text-anchor="middle">timeout</text>
  <text class="muted" x="690" y="240" text-anchor="middle">charged the card</text>

  <text class="muted" x="400" y="282" text-anchor="middle">both look like a timeout, so the client retries; after a lost response, the retry is a duplicate</text>
</svg>
