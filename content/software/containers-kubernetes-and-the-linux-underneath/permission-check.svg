<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" role="img" aria-labelledby="t">
  <title id="t">How the kernel decides whether a process may open a file. If the process has CAP_DAC_OVERRIDE (normally root), the bit check is bypassed. Otherwise: if the process UID equals the file's owner UID, only the owner bits are used. Else if the file's GID is the process's GID or one of its supplementary groups, only the group bits are used. Else the other bits are used. The chosen bits either allow the operation or the result is EACCES, Permission denied. Worked example: UID 1654 trying to create /app/data where /app is owned by 0:0 with mode 755 falls through to the other bits, r-x, which have no w</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 13.5px; }
    .small { font-size: 12px; }
    .muted { fill: #9baeca; font-size: 11.5px; }
    .acc { fill: #7dd3fc; font-size: 12px; }
    .region { fill: none; stroke: #3a4d6b; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .line { fill: none; stroke: #3a4d6b; stroke-width: 1.5; }
    .arrow { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9baeca"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="760" height="470" fill="#08111f"/>

  <rect class="box" x="30" y="20" width="300" height="44" rx="5"/>
  <text class="small" x="44" y="40">process wants to read/write/x</text>
  <text class="muted" x="44" y="56">a file or directory</text>

  <rect class="box" x="30" y="92" width="300" height="44" rx="5"/>
  <text class="small" x="44" y="119">has CAP_DAC_OVERRIDE?</text>
  <rect class="box" x="30" y="164" width="300" height="44" rx="5"/>
  <text class="small" x="44" y="191">process UID == file owner?</text>
  <rect class="box" x="30" y="236" width="300" height="56" rx="5"/>
  <text class="small" x="44" y="260">file GID in process GID or</text>
  <text class="small" x="44" y="278">supplementary groups?</text>

  <path class="line" d="M180 64 L180 90" marker-end="url(#a)"/>
  <path class="line" d="M180 136 L180 162" marker-end="url(#a)"/>
  <text class="muted" x="188" y="154">no</text>
  <path class="line" d="M180 208 L180 234" marker-end="url(#a)"/>
  <text class="muted" x="188" y="226">no</text>
  <path class="line" d="M180 292 L180 318" marker-end="url(#a)"/>
  <text class="muted" x="188" y="310">no</text>

  <rect class="box" x="400" y="92" width="150" height="44" rx="5"/>
  <text class="small" x="414" y="119">bypass the bits</text>
  <rect class="box" x="400" y="164" width="150" height="44" rx="5"/>
  <text class="small" x="414" y="191">use OWNER bits</text>
  <rect class="box" x="400" y="242" width="150" height="44" rx="5"/>
  <text class="small" x="414" y="269">use GROUP bits</text>
  <rect class="hl" x="30" y="320" width="300" height="44" rx="5"/>
  <text class="small" x="44" y="347">use OTHER bits</text>

  <path class="line" d="M330 114 L398 114" marker-end="url(#a)"/>
  <text class="muted" x="346" y="108">yes</text>
  <path class="line" d="M330 186 L398 186" marker-end="url(#a)"/>
  <text class="muted" x="346" y="180">yes</text>
  <path class="line" d="M330 264 L398 264" marker-end="url(#a)"/>
  <text class="muted" x="346" y="258">yes</text>

  <text class="small" x="580" y="160">Exactly one set</text>
  <text class="small" x="580" y="178">is checked. The</text>
  <text class="small" x="580" y="196">owner never falls</text>
  <text class="small" x="580" y="214">through to group</text>
  <text class="small" x="580" y="232">or other.</text>
  <text class="muted" x="580" y="262">bit missing →</text>
  <text class="muted" x="580" y="280">EACCES</text>
  <text class="muted" x="580" y="298">"Permission denied"</text>

  <rect class="region" x="350" y="320" width="390" height="132" rx="8"/>
  <text class="acc" x="364" y="342">payments: mkdir /app/data</text>
  <text class="small" x="364" y="366">process: uid=1654 gid=1654</text>
  <text class="small" x="364" y="386">/app:    0:0  drwxr-xr-x</text>
  <text class="small" x="364" y="406">no cap · not owner · not group</text>
  <text class="small" x="364" y="426">→ other = r-x, needs w</text>
  <text class="acc" x="364" y="444">→ Permission denied</text>
  <path class="arrow" d="M330 342 L348 342" marker-end="url(#b)"/>
</svg>
