<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 310" role="img" aria-labelledby="t">
  <title id="t">The bank key mounted from a Secret, read by a process running as UID 1654 in group 1654. With defaultMode 0400 alone, the file is owned by 0:0 with mode r-- --- ---; the process matches neither owner nor group, the other bits are empty, and the read fails with EACCES. With fsGroup 1654 added, the kubelet sets the file's group to 1654 and ORs in 0440, giving r-- r-- ---; the group bits apply and the read is allowed</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .bad { fill: #fca5a5; font-size: 12px; }
    .hltext { fill: #7dd3fc; font-size: 12px; }
    .band { fill: #0d1829; stroke: #3a4d6b; stroke-width: 1.5; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .badbox { fill: #2a1620; stroke: #f87171; stroke-width: 1.5; }
    .ptr { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
    .badptr { fill: none; stroke: #f87171; stroke-width: 1.75; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="800" height="310" fill="#08111f"/>

  <rect class="band" x="20" y="20" width="370" height="270" rx="8"/>
  <text x="205" y="46" text-anchor="middle">defaultMode: 0400</text>
  <rect class="badbox" x="40" y="62" width="330" height="74" rx="6"/>
  <text x="56" y="86">/etc/bank/tls.key</text>
  <text class="muted" x="56" y="106">owner 0   group 0</text>
  <text class="muted" x="56" y="124">0400   r-- --- ---</text>
  <path class="badptr" d="M205 172 V140" marker-end="url(#r)"/>
  <rect class="box" x="40" y="176" width="330" height="40" rx="6"/>
  <text x="205" y="201" text-anchor="middle">UID 1654, groups 1654</text>
  <text class="bad" x="205" y="246" text-anchor="middle">not owner, not group: other bits ---</text>
  <text class="bad" x="205" y="266" text-anchor="middle">EACCES: Permission denied</text>

  <rect class="band" x="410" y="20" width="370" height="270" rx="8"/>
  <text x="595" y="46" text-anchor="middle">+ fsGroup: 1654</text>
  <rect class="hl" x="430" y="62" width="330" height="74" rx="6"/>
  <text x="446" y="86">/etc/bank/tls.key</text>
  <text class="muted" x="446" y="106">owner 0   group 1654</text>
  <text class="muted" x="446" y="124">0440   r-- r-- ---</text>
  <path class="ptr" d="M595 172 V140" marker-end="url(#a)"/>
  <rect class="box" x="430" y="176" width="330" height="40" rx="6"/>
  <text x="595" y="201" text-anchor="middle">UID 1654, groups 1654</text>
  <text class="hltext" x="595" y="246" text-anchor="middle">group 1654 matches: r--, read allowed</text>
  <text class="muted" x="595" y="266" text-anchor="middle">kubelet: group := 1654, mode |= 0440</text>
</svg>
