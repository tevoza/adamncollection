<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="t">
  <title id="t">Image layers stacked under a container. Bottom to top: base OS layer (Ubuntu), .NET runtime layer, an app layer with the published DLLs, and a thin writable container layer. A read of /app/Payments.Api.dll falls through to the app layer; a write to /app/data/started.txt lands in the writable layer, which is discarded when the container is removed</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 13.5px; }
    .small { font-size: 12px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .acc { fill: #7dd3fc; font-size: 12px; }
    .region { fill: none; stroke: #3a4d6b; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; stroke-dasharray: 5 3; }
    .arrow { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
  </defs>
  <rect width="760" height="400" fill="#08111f"/>

  <rect class="region" x="40" y="104" width="400" height="260" rx="8"/>
  <text class="muted" x="52" y="122">image: read-only, shared, cached</text>

  <rect class="hl" x="40" y="30" width="400" height="58" rx="5"/>
  <text x="56" y="54">writable container layer</text>
  <text class="muted" x="56" y="74">per container · gone when it's removed</text>

  <rect class="box" x="60" y="134" width="360" height="58" rx="5"/>
  <text x="76" y="158">app layer</text>
  <text class="muted" x="76" y="178">COPY --from=build /app/publish .</text>

  <rect class="box" x="60" y="206" width="360" height="58" rx="5"/>
  <text x="76" y="230">ASP.NET Core runtime</text>
  <text class="muted" x="76" y="250">from mcr.microsoft.com/dotnet/aspnet</text>

  <rect class="box" x="60" y="278" width="360" height="58" rx="5"/>
  <text x="76" y="302">base OS (Ubuntu)</text>
  <text class="muted" x="76" y="322">/bin, /etc/passwd, libc, ...</text>

  <text class="acc" x="470" y="54">write /app/data/started.txt</text>
  <path class="arrow" d="M466 60 L446 60" marker-end="url(#a)"/>
  <text class="muted" x="470" y="74">lands in the top layer</text>

  <text class="acc" x="470" y="148">read /app/Payments.Api.dll</text>
  <path class="arrow" d="M466 154 C452 154, 452 162, 426 162" marker-end="url(#a)"/>
  <text class="muted" x="470" y="168">looks top-down; found here</text>

  <text class="small" x="470" y="230">Modify a lower file:</text>
  <text class="muted" x="470" y="248">copied up to the top layer first</text>
  <text class="small" x="470" y="282">Delete a lower file:</text>
  <text class="muted" x="470" y="300">a whiteout hides it; the bytes</text>
  <text class="muted" x="470" y="316">stay in the lower layer</text>
  <text class="small" x="470" y="350">Layers stack via overlayfs</text>
</svg>
