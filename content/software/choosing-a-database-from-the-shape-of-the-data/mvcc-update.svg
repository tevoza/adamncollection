<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t">
  <title id="t">An UPDATE by transaction 205: an ordinary update writes a new row version on another page plus a new index entry; a HOT update keeps the new version on the same page with no new index entry</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 13px; }
    .h { font-size: 15px; }
    .muted { fill: #9baeca; font-size: 11.5px; }
    .frame { fill: none; stroke: #3a4d6b; stroke-width: 1.5; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .old { fill: #13233b; stroke: #9baeca; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .ptr { fill: none; stroke: #9baeca; stroke-width: 1.5; }
    .ptrhl { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
    .ctid { fill: none; stroke: #c084fc; stroke-width: 1.75; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9baeca"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c084fc"/></marker>
  </defs>
  <rect width="720" height="340" fill="#08111f"/>

  <!-- Ordinary update -->
  <text class="h" x="185" y="28" text-anchor="middle">Ordinary UPDATE</text>
  <rect class="frame" x="40" y="44" width="290" height="62" rx="6"/>
  <text class="muted" x="50" y="60">index</text>
  <rect class="box" x="52" y="68" width="125" height="28" rx="4"/>
  <text x="114" y="87" text-anchor="middle">key → (7,1)</text>
  <rect class="hl" x="193" y="68" width="125" height="28" rx="4"/>
  <text x="255" y="87" text-anchor="middle">key → (9,3)</text>

  <rect class="frame" x="40" y="150" width="125" height="112" rx="6"/>
  <text class="muted" x="50" y="166">page 7</text>
  <rect class="old" x="48" y="176" width="109" height="76" rx="4"/>
  <text x="102" y="197" text-anchor="middle">v1</text>
  <text class="muted" x="102" y="217" text-anchor="middle">xmin 100</text>
  <text class="muted" x="102" y="236" text-anchor="middle">xmax 205</text>

  <rect class="frame" x="205" y="150" width="125" height="112" rx="6"/>
  <text class="muted" x="215" y="166">page 9</text>
  <rect class="hl" x="213" y="176" width="109" height="76" rx="4"/>
  <text x="267" y="197" text-anchor="middle">v2</text>
  <text class="muted" x="267" y="217" text-anchor="middle">xmin 205</text>
  <text class="muted" x="267" y="236" text-anchor="middle">xmax 0</text>

  <path class="ptr" d="M114 96 L104 172" marker-end="url(#m)"/>
  <path class="ptrhl" d="M255 96 L265 172" marker-end="url(#a)"/>
  <path class="ctid" d="M157 214 L209 214" marker-end="url(#p)"/>
  <text class="muted" x="185" y="232" text-anchor="middle">t_ctid</text>

  <!-- HOT update -->
  <text class="h" x="545" y="28" text-anchor="middle">HOT UPDATE</text>
  <rect class="frame" x="400" y="44" width="290" height="62" rx="6"/>
  <text class="muted" x="410" y="60">index</text>
  <rect class="box" x="412" y="68" width="125" height="28" rx="4"/>
  <text x="474" y="87" text-anchor="middle">key → (7,1)</text>
  <text class="muted" x="613" y="87" text-anchor="middle">no new entry</text>

  <rect class="frame" x="400" y="150" width="290" height="112" rx="6"/>
  <text class="muted" x="410" y="166">page 7</text>
  <rect class="old" x="412" y="176" width="109" height="76" rx="4"/>
  <text x="466" y="197" text-anchor="middle">v1</text>
  <text class="muted" x="466" y="217" text-anchor="middle">xmin 100</text>
  <text class="muted" x="466" y="236" text-anchor="middle">xmax 205</text>
  <rect class="hl" x="569" y="176" width="109" height="76" rx="4"/>
  <text x="623" y="197" text-anchor="middle">v2</text>
  <text class="muted" x="623" y="217" text-anchor="middle">xmin 205</text>
  <text class="muted" x="623" y="236" text-anchor="middle">xmax 0</text>

  <path class="ptr" d="M474 96 L468 172" marker-end="url(#m)"/>
  <path class="ctid" d="M521 214 L565 214" marker-end="url(#p)"/>
  <text class="muted" x="545" y="232" text-anchor="middle">t_ctid</text>

  <text class="muted" x="360" y="294" text-anchor="middle">Transaction 205 updates the row. v1 isn't overwritten: its xmax is set, v2 is written,</text>
  <text class="muted" x="360" y="311" text-anchor="middle">and t_ctid links them. Ordinary: v2 lands anywhere, so every index gets a new entry.</text>
  <text class="muted" x="360" y="328" text-anchor="middle">HOT: no indexed column changed and page 7 had room, so the index is untouched.</text>
</svg>
