<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 370" role="img" aria-labelledby="t">
  <title id="t">Relational databases pay at query time: normalised tables feed a planner that answers any query, with cost decided at runtime and writes through one primary. Partitioned stores pay at design time: access patterns drive a key design that spreads data across partitions, so a query on one key reads one partition cheaply while a cross-partition query is expensive or impossible</title>
  <style>
    text { font-family: ui-monospace, "SFMono-Regular", Consolas, Menlo, monospace; fill: #ebf1ff; font-size: 14px; }
    .sm { font-size: 12px; }
    .muted { fill: #9baeca; font-size: 12px; }
    .bad { fill: #fca5a5; font-size: 12px; }
    .band { fill: #0d1829; stroke: #3a4d6b; stroke-width: 1.5; }
    .box { fill: #13233b; stroke: #3a4d6b; stroke-width: 1.5; }
    .hl { fill: #13233b; stroke: #7dd3fc; stroke-width: 2; }
    .ptr { fill: none; stroke: #7dd3fc; stroke-width: 1.75; }
    .dir { fill: none; stroke: #9baeca; stroke-width: 1.5; }
    .badptr { fill: none; stroke: #f87171; stroke-width: 1.75; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9baeca"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect width="800" height="370" fill="#08111f"/>

  <rect class="band" x="20" y="20" width="370" height="330" rx="8"/>
  <text x="205" y="46" text-anchor="middle">Relational: pay at query time</text>

  <rect class="box" x="40" y="70" width="140" height="34" rx="5"/>
  <text class="sm" x="110" y="92" text-anchor="middle">customers</text>
  <rect class="box" x="40" y="114" width="140" height="34" rx="5"/>
  <text class="sm" x="110" y="136" text-anchor="middle">orders</text>
  <rect class="box" x="40" y="158" width="140" height="34" rx="5"/>
  <text class="sm" x="110" y="180" text-anchor="middle">order_lines</text>
  <text class="muted" x="110" y="214" text-anchor="middle">each fact stored once</text>

  <rect class="hl" x="230" y="103" width="140" height="56" rx="6"/>
  <text x="300" y="127" text-anchor="middle">planner</text>
  <text class="muted" x="300" y="146" text-anchor="middle">any query</text>
  <path class="dir" d="M180 87 L226 120" marker-end="url(#m)"/>
  <path class="dir" d="M180 131 H226" marker-end="url(#m)"/>
  <path class="dir" d="M180 175 L226 142" marker-end="url(#m)"/>
  <text class="muted" x="300" y="182" text-anchor="middle">joins at query time</text>

  <text class="muted" x="205" y="262" text-anchor="middle">+ questions nobody planned for</text>
  <text class="muted" x="205" y="284" text-anchor="middle">+ transactions across any rows</text>
  <text class="bad" x="205" y="306" text-anchor="middle">− cost decided at runtime</text>
  <text class="bad" x="205" y="328" text-anchor="middle">− writes limited to one primary</text>

  <rect class="band" x="410" y="20" width="370" height="330" rx="8"/>
  <text x="595" y="46" text-anchor="middle">Partitioned: pay at design time</text>

  <rect class="box" x="430" y="66" width="150" height="70" rx="6"/>
  <text class="sm" x="505" y="88" text-anchor="middle">access patterns</text>
  <text class="muted" x="505" y="108" text-anchor="middle">customer by id</text>
  <text class="muted" x="505" y="125" text-anchor="middle">orders by date</text>
  <rect class="hl" x="610" y="66" width="150" height="70" rx="6"/>
  <text class="sm" x="685" y="88" text-anchor="middle">key design</text>
  <text class="muted" x="685" y="108" text-anchor="middle">PK = CUSTOMER#id</text>
  <text class="muted" x="685" y="125" text-anchor="middle">SK = ORDER#date</text>
  <path class="ptr" d="M580 101 H606" marker-end="url(#a)"/>

  <path class="dir" d="M685 136 L488 168" marker-end="url(#m)"/>
  <path class="dir" d="M685 136 L600 168" marker-end="url(#m)"/>
  <path class="dir" d="M685 136 L712 168" marker-end="url(#m)"/>

  <rect class="box" x="440" y="172" width="96" height="48" rx="6"/>
  <text class="sm" x="488" y="201" text-anchor="middle">P1</text>
  <rect class="hl" x="552" y="172" width="96" height="48" rx="6"/>
  <text class="sm" x="600" y="192" text-anchor="middle">P2</text>
  <text class="muted" x="600" y="210" text-anchor="middle">CUSTOMER#42</text>
  <rect class="box" x="664" y="172" width="96" height="48" rx="6"/>
  <text class="sm" x="712" y="201" text-anchor="middle">P3</text>

  <path class="badptr" d="M488 222 C488 250, 712 250, 712 224" marker-start="url(#r)" marker-end="url(#r)"/>

  <text class="muted" x="595" y="262" text-anchor="middle">+ one key, one partition</text>
  <text class="muted" x="595" y="284" text-anchor="middle">+ same cost at any size</text>
  <text class="bad" x="595" y="306" text-anchor="middle">− cross-partition: expensive</text>
  <text class="bad" x="595" y="328" text-anchor="middle">or impossible</text>
</svg>
