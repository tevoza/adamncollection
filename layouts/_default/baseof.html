<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {{ if .IsHome }}
        {{ .Site.Title }}
      {{ else }}
        {{ .Title }} | {{ .Site.Title }}
      {{ end }}
    </title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}" />
    <link rel="stylesheet" href="{{ "css/chroma.css" | relURL }}" />
    {{ with .OutputFormats.Get "RSS" -}}
      <link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .RelPermalink }}">
    {{- end }}
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="site-title" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
        <nav class="site-nav" aria-label="Primary">
          {{ range .Site.Menus.main }}
            <a href="{{ .URL | relURL }}">{{ .Name }}</a>
          {{ end }}
        </nav>
      </header>

      <main class="site-main">
        {{ block "main" . }}{{ end }}
      </main>

      <footer class="site-footer">
        <p>{{ .Site.Params.description }}</p>
        {{ with .Site.Params.githubRepo }}
          <p><a href="{{ . }}">GitHub</a></p>
        {{ end }}
      </footer>
    </div>
  </body>
</html>
